services:
  - type: web
    name: civic-backend
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python scripts/init_db.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_SYNC
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: AI_SERVICE_URL
        value: "https://civic-ai.onrender.com"

  - type: web
    name: civic-admin
    runtime: node
    plan: free
    buildCommand: "npm install && CI=false npm run build"
    startCommand: "npx serve -s build -l $PORT"
    envVars:
      - key: REACT_APP_API_URL
        value: "https://civic-backend.onrender.com/api/v1"

  - type: web
    name: civic-ai
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHONUNBUFFERED
        value: "true"